# ========================================================================
# SW Service Desk v1.0 - Configuração Nginx Reverse Proxy com HTTPS
# Empresa: SW Cloud Solutions
# ========================================================================

# Limite de taxa de pedidos por IP (Rate Limiting Shield)
limit_req_zone $binary_remote_addr zone=sw_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=sw_auth_limit:10m rate=5r/m;

# Redirecionamento HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name servicedesk.swcloudsolutions.pt;

    # Certbot acme challenge para renovação automática de SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor Seguro HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name servicedesk.swcloudsolutions.pt;

    # Certificados SSL / TLS (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/servicedesk.swcloudsolutions.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servicedesk.swcloudsolutions.pt/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Cabeçalhos de Segurança (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Tamanho Máximo de Uploads (25MB para suportar anexos de 20MB)
    client_max_body_size 25M;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proteção de rate limit para rotas de autenticação
    location /api/v1/auth/login {
        limit_req zone=sw_auth_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy geral para a aplicação Node.js / Express
    location / {
        limit_req zone=sw_api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
